# Opciones de Gradle para compilar la parte Android de la app.

# Memoria que puede usar Gradle. La plantilla de Flutter pide 8 GB, más de lo que tiene
# el computador del proyecto (7,4 GB): la JVM se caía al reservarla (hs_err_pid*.log).
# 2,5 GB alcanzan para compilar la app, también la versión release con R8.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin compila dentro del proceso de Gradle en lugar de abrir otro proceso con su
# propia memoria.
kotlin.compiler.execution.strategy=in-process
# Usa AndroidX, las bibliotecas actuales de Android.
android.useAndroidX=true
# Jetifier convierte a AndroidX las bibliotecas antiguas que aún usan las anteriores.
android.enableJetifier=true
